titulo: O trabalho invisível que a IA está tirando das equipes de vendas
titulo_curto: Trabalho invisível em vendas
autor: Newton
evento: Hacktown 2026
duracao: 45min
resumo: >
  A maior parte do tempo de um vendedor não é gasta vendendo, mas pesquisando, organizando
  informações e preparando contatos. Como agentes de IA assumem esse trabalho invisível — e por
  que o resultado não é substituir vendedores, mas permitir que equipes pequenas operem em uma
  escala antes reservada a organizações muito maiores.
