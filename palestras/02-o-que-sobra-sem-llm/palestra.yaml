titulo: O que sobra quando você tira o LLM do seu agente?
titulo_curto: O harness dos agentes
autor: Newton
evento: Hacktown 2026
duracao: 45min + 15min de perguntas
resumo: >
  Durante meses acreditamos que estávamos construindo agentes de IA. Com o tempo percebemos que
  passávamos a maior parte do esforço construindo tudo ao redor deles: observabilidade, auditoria,
  billing, execução, agendamento, integrações e segurança. A história de como construímos o agente
  da Ground — e por que o verdadeiro desafio não é o LLM, mas o harness que o transforma em software
  de produção, reaproveitando praticamente todos os fundamentos da engenharia de software dos
  últimos 20 anos.
